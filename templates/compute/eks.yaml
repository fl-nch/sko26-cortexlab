AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EKS cluster in the two private subnets (from the vpc stack), with a managed
  node group. The API endpoint is private-only and reachable from the lab VMs:
  the VM security groups are allowed into the cluster security group (kubectl +
  workload traffic), and each VM's instance role is mapped as a cluster admin
  via an EKS access entry.

Parameters:
  NamePrefix:
    Type: String
    Default: sko26-cortexlab
    Description: Prefix applied to all resource names in this stack.
  KubernetesVersion:
    Type: String
    Default: "1.34"
    Description: >
      EKS Kubernetes control-plane version. Adjust if this version is outside
      the EKS standard-support window at deploy time.
  NodeInstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type for the managed node group.
  NodeGroupMinSize:
    Type: Number
    Default: 1
    Description: Minimum number of worker nodes.
  NodeGroupDesiredSize:
    Type: Number
    Default: 2
    Description: Desired number of worker nodes (one per AZ by default).
  NodeGroupMaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of worker nodes.

Resources:
  # ---------------------------------------------------------------------------
  # IAM
  # ---------------------------------------------------------------------------
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Project
          Value: !Ref NamePrefix

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        # Lets nodes be reached through SSM Session Manager too, like the VMs.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: !Ref NamePrefix

  # ---------------------------------------------------------------------------
  # Cluster
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${NamePrefix}-eks"
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      # Access entries (below) drive authorization; API mode is required for them.
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      ResourcesVpcConfig:
        SubnetIds:
          - !ImportValue private-subnet-a-id
          - !ImportValue private-subnet-b-id
        # Private-only endpoint: reachable from inside the VPC (the VMs), not
        # the public internet. Flip EndpointPublicAccess to true if you need
        # kubectl straight from a workstation.
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-eks"
        - Key: Project
          Value: !Ref NamePrefix

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      Subnets:
        - !ImportValue private-subnet-a-id
        - !ImportValue private-subnet-b-id
      InstanceTypes:
        - !Ref NodeInstanceType
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      ScalingConfig:
        MinSize: !Ref NodeGroupMinSize
        DesiredSize: !Ref NodeGroupDesiredSize
        MaxSize: !Ref NodeGroupMaxSize
      Tags:
        Name: !Sub "${NamePrefix}-eks-node"
        Project: !Ref NamePrefix

  # ---------------------------------------------------------------------------
  # Access from the VMs
  # ---------------------------------------------------------------------------
  # Network reachability: allow all traffic from each VM security group into the
  # cluster security group (attached to the control-plane ENIs and the nodes),
  # covering both the API server (443) and pod/service traffic.
  ClusterIngressFromLinuxVm:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Cluster.ClusterSecurityGroupId
      IpProtocol: "-1"
      SourceSecurityGroupId: !ImportValue linux-vm-sg-id
      Description: Allow all traffic from the Linux VM (kubectl + workloads)

  ClusterIngressFromWinVm:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Cluster.ClusterSecurityGroupId
      IpProtocol: "-1"
      SourceSecurityGroupId: !ImportValue win-vm-sg-id
      Description: Allow all traffic from the Windows VM (kubectl + workloads)

  # Reverse reachability: allow traffic from the cluster security group (worker
  # nodes / pods egress via the node ENI, which is in this SG) back into each VM
  # security group. This lets exploits that call back to a listener on a VM -
  # reverse shells, Log4Shell JNDI/DNS callbacks - actually connect. The VMs
  # otherwise have no inbound rules, so this is the only path pod -> VM.
  LinuxVmIngressFromCluster:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue linux-vm-sg-id
      IpProtocol: "-1"
      SourceSecurityGroupId: !GetAtt Cluster.ClusterSecurityGroupId
      Description: Allow callbacks from EKS nodes/pods (reverse shells, JNDI)

  WinVmIngressFromCluster:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue win-vm-sg-id
      IpProtocol: "-1"
      SourceSecurityGroupId: !GetAtt Cluster.ClusterSecurityGroupId
      Description: Allow callbacks from EKS nodes/pods (reverse shells, JNDI)

  # kubectl authorization: map each VM instance role as a cluster admin.
  LinuxVmAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !ImportValue linux-vm-role-arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  WinVmAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !ImportValue win-vm-role-arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

Outputs:
  ClusterName:
    Description: EKS cluster name.
    Value: !Ref Cluster
    Export:
      Name: eks-cluster-name
  ClusterEndpoint:
    Description: EKS API server endpoint (private).
    Value: !GetAtt Cluster.Endpoint
  ClusterSecurityGroupId:
    Description: Cluster security group (control plane + nodes).
    Value: !GetAtt Cluster.ClusterSecurityGroupId
    Export:
      Name: eks-cluster-sg-id
  UpdateKubeconfigCommand:
    Description: >-
      Run this from a VM (Linux VM recommended) to configure kubectl. The API
      endpoint is private, so it only resolves from inside the VPC.
    Value: !Sub "aws eks update-kubeconfig --region ${AWS::Region} --name ${Cluster}"

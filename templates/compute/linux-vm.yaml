AWSTemplateFormatVersion: "2010-09-09"
Description: >
  sko26-lab-linux-vm: an EC2 instance in the public subnet with outbound internet
  access. Reached via SSM Session Manager (no SSH keypair, no inbound rules).

Parameters:
  NamePrefix:
    Type: String
    Default: sko26-cortexlab
    Description: Prefix applied to all resource names in this stack.
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Latest Amazon Linux 2023 AMI, resolved from the public SSM parameter.
      AL2023 ships with the SSM Agent pre-installed.

Resources:
  # Role that lets the instance be managed by SSM Session Manager.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: transfer-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !ImportValue transfer-bucket-arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn: !ImportValue transfer-bucket-arn
      Tags:
        - Key: Project
          Value: !Ref NamePrefix

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # No inbound rules — SSM needs none. Outbound open for internet access
  # (including the SSM control-channel endpoints).
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix}-linux-vm outbound-only (SSM managed, no inbound)"
      VpcId: !ImportValue vpc-id
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-linux-vm-sg"
        - Key: Project
          Value: !Ref NamePrefix

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !ImportValue public-subnet-id
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-linux-vm"
        - Key: Project
          Value: !Ref NamePrefix

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref Instance
  ConnectCommand:
    Description: Open a shell on the instance via SSM Session Manager.
    Value: !Sub "aws ssm start-session --target ${Instance}"
  SecurityGroupId:
    Description: Instance security group ID (consumed by the EKS stack).
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: linux-vm-sg-id
  InstanceRoleArn:
    Description: Instance IAM role ARN (mapped into EKS as a cluster admin).
    Value: !GetAtt InstanceRole.Arn
    Export:
      Name: linux-vm-role-arn
